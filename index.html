  <!-- BLOQUEIO DE MODAL - Carrega PRIMEIRO para prevenir abertura -->
  <script>
    // Executa IMEDIATAMENTE antes de qualquer outro script
    (function() {
      // Previne abertura de modais
      window.abrirModal = function() { return false; };
      window.openModal = function() { return false; };
      window.showModal = function() { return false; };
      window.exibirModal = function() { return false; };
      window.toggleModal = function() { return false; };
      window.closeModal = function() { return true; };
      window.fecharModal = function() { return true; };
      
      // CSS inline para esconder modais
      var style = document.createElement('style');
      style.textContent = `
        .modal, .modal-overlay, #modalOverlay, .modal-backdrop,
        .modal-content, #pinModal, #loginModal, #configModal,
        #modal, .modal-dialog, .modal-container, #modalContainer,
        .modal-wrapper, #modalWrapper, .modal-outer, #modalOuter,
        [class*="modal"], [id*="modal"], [class*="Modal"], [id*="Modal"],
        .overlay, #overlay, .backdrop, #backdrop,
        .popup, #popup, .dialog, #dialog {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
          pointer-events: none !important;
          position: fixed !important;
          top: -9999px !important;
          left: -9999px !important;
          z-index: -9999 !important;
        }
        body {
          overflow: auto !important;
          position: static !important;
        }
      `;
      document.head.appendChild(style);
    })();
  </script>
